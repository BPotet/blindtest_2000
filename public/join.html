<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Blindtest 2000 — Rejoindre</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="brand">
      <span class="brand__logo">Blindtest 2000</span>
      <button id="mute-btn" class="icon-btn" style="margin-left:auto" aria-label="Activer ou couper le son">🔊</button>
    </header>

    <!-- Écran de connexion -->
    <section id="screen-join" class="screen screen--active">
      <div class="card">
        <h1>Rejoindre une partie</h1>
        <label for="join-code">Code de la salle</label>
        <input id="join-code" inputmode="latin" autocapitalize="characters" autocomplete="off"
               maxlength="6" placeholder="Ex. ABCDE" style="text-transform:uppercase; letter-spacing:0.2em; font-weight:800;" />
        <div class="field-error" id="code-error"></div>
        <label for="join-pseudo">Ton pseudo</label>
        <input id="join-pseudo" maxlength="24" autocomplete="off" placeholder="Ex. DJ Kévin" />
        <div class="field-error" id="pseudo-error"></div>
        <div id="team-section" style="display:none;">
          <label>Ton équipe</label>
          <div id="team-chips" class="team-chips"></div>
          <input id="new-team" maxlength="24" autocomplete="off" placeholder="…ou crée une nouvelle équipe" />
          <div class="field-error" id="team-error"></div>
        </div>
        <button id="join-btn" class="btn btn--lg" style="margin-top:12px;">Rejoindre</button>
      </div>
    </section>

    <!-- Salle d'attente -->
    <section id="screen-wait" class="screen">
      <div class="card center">
        <h1>Bienvenue, <span id="wait-pseudo"></span> !</h1>
        <p class="muted" id="wait-quiz"></p>
        <div class="spinner" style="margin:24px auto; width:36px; height:36px;"></div>
        <p>En attente du démarrage par l'hôte…</p>
      </div>
    </section>

    <!-- Question en cours -->
    <section id="screen-question" class="screen">
      <div class="card">
        <div class="round-head">
          <div>
            <span class="badge" id="q-progress"></span>
            <span class="badge" id="q-streak" style="display:none; color:#f59e0b; font-weight:800;"></span>
          </div>
          <div class="timer" id="q-timer">--</div>
        </div>
        <div class="progress"><div class="progress__bar" id="q-bar"></div></div>
        <h2 id="q-text" class="center">Écoute bien…</h2>
        <!-- Son sur le téléphone (si l'hôte l'a activé) : lecteur caché + bouton d'écoute -->
        <div id="player-audio-section" style="display:none; margin:8px 0 14px;">
          <div class="audio-wrap"><div id="player-audio"></div>
            <div class="audio-cover"><span id="player-audio-label">🎧 Son du blindtest</span></div>
          </div>
          <button id="player-audio-btn" class="btn btn--lg btn--success" style="display:none; margin-top:10px;">🔊 Appuie pour lancer le son</button>
        </div>
        <div class="options" id="q-options"></div>
        <button id="team-lock-btn" class="btn btn--lg btn--success" style="display:none; margin-top:12px;" disabled>🔒 Verrouiller la réponse</button>
        <p class="center muted" id="q-status" style="margin-top:16px;"></p>
      </div>
    </section>

    <!-- Résultat de la manche -->
    <section id="screen-feedback" class="screen">
      <div id="feedback-banner" class="result-banner">
        <h2 id="feedback-title"></h2>
        <div class="big-points" id="feedback-points"></div>
        <div id="feedback-streak" class="streak"></div>
        <p id="feedback-answer" class="muted"></p>
      </div>
      <div class="card">
        <h2>Réponses</h2>
        <div class="dist" id="feedback-distribution"></div>
      </div>
      <div class="card">
        <h2>Classement</h2>
        <div class="leaderboard" id="feedback-leaderboard"></div>
        <p class="center" id="feedback-autonext" style="display:none; font-size:18px; font-weight:800; margin-top:14px;"></p>
      </div>
    </section>

    <!-- Fin de partie -->
    <section id="screen-final" class="screen">
      <div class="card center">
        <h1>🏆 Terminé !</h1>
        <div id="player-podium"></div>
        <p class="muted">Ton classement final</p>
        <div class="big-points" id="final-rank"></div>
        <p id="final-score" class="muted"></p>
      </div>
      <div class="card">
        <div class="leaderboard" id="final-board"></div>
        <button onclick="location.href='/join'" class="btn btn--lg" style="margin-top:16px;">Rejouer</button>
      </div>
    </section>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
